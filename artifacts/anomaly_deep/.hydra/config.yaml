data:
  input_days: 14
  lead_times:
  - 1
  - 3
  - 5
  - 7
  crop: 128
  min_input_frames: 2
  min_target_coverage: 0.05
  min_water_frequency: 0.05
  augment: true
  batch_size: 8
  num_workers: 0
model:
  name: anomaly_deep
  base: 32
  depth: 4
  blocks: 2
  use_doy: true
  use_attention: true
  delta_scale: 0.5
  n_scales: 3
  dropout: 0.1
train:
  max_epochs: 60
  lr: 0.0003
  weight_decay: 0.0001
  huber_delta: 1.0
  lead_weighting: linear
  warmup_epochs: 2
  precision: 16-mixed
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  early_stopping_patience: 12
  monitor: val/skill_overall
  monitor_mode: max
  log_every_n_steps: 10
  deterministic: false
seed: 1337
experiment_name: hab-forecast
run_name: anomaly-deep-v1
paths:
  repo_root: ${hydra:runtime.cwd}
  aoi: ${paths.repo_root}/data/aoi/lakes.geojson
  cubes: /app/data/processed/cubes
  artifacts: ${paths.repo_root}/artifacts
  mlflow_uri: http://mlflow:5000
