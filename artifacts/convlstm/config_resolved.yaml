data:
  input_days: 14
  lead_times:
  - 1
  - 3
  - 5
  - 7
  crop: 128
  min_input_frames: 2
  min_target_coverage: 0.05
  min_water_frequency: 0.05
  augment: true
  batch_size: 8
  num_workers: 0
model:
  name: convlstm
  hidden: 48
  layers: 2
  kernel_size: 3
  use_doy: true
  dropout: 0.1
  gradient_checkpointing: true
train:
  max_epochs: 60
  lr: 0.0003
  weight_decay: 0.0001
  huber_delta: 1.0
  lead_weighting: linear
  warmup_epochs: 2
  precision: 16-mixed
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  early_stopping_patience: 12
  monitor: val/skill_overall
  monitor_mode: max
  log_every_n_steps: 10
  deterministic: false
seed: 1337
