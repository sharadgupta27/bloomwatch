# Reproducible base environment for habforecast.
#
#   conda env create -f environment.yml
#   conda activate hab
#   bash scripts/install_torch.sh      # CUDA wheel - machine specific, see below
#   pip install -e ".[all]"
#
# The geospatial stack comes from conda-forge (it owns the GDAL/PROJ/HDF5 binaries).
#
# PyTorch is deliberately NOT listed here. Putting `--extra-index-url .../cu124` in a
# pip block does not work: pip still resolves the highest matching version, which is the
# CPU-only wheel on PyPI, and you silently end up training on CPU. The CUDA build must
# be installed separately with `--index-url` so the PyTorch index is the *only* source.
# scripts/install_torch.sh does that and verifies torch.cuda.is_available().
name: hab
channels:
  - conda-forge
dependencies:
  - python=3.12
  # --- array / io core ---
  - numpy>=1.26
  - pandas>=2.1
  - xarray>=2024.1
  - zarr>=2.17
  - dask>=2024.1
  - h5py>=3.10
  - h5netcdf>=1.3
  - netcdf4>=1.6
  - fsspec>=2024.2
  - aiohttp>=3.9
  - requests>=2.31
  # --- geospatial ---
  - rasterio>=1.3
  - rioxarray>=0.15
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - pyresample>=1.28        # swath -> grid resampling for OLCI curvilinear geolocation
  # --- science ---
  - scipy>=1.11
  - scikit-learn>=1.4
  - matplotlib>=3.8
  # --- tooling ---
  - tqdm>=4.66
  - rich>=13.7
  - typer>=0.9
  - pytest>=8.0
  - pytest-cov>=4.1
  - ruff>=0.3
  - jupyterlab>=4.1
  - pip>=24.0
  - pip:
      # torch installed separately - see scripts/install_torch.sh
      - lightning>=2.2
      - hydra-core>=1.3
      - mlflow>=2.11
      - dvc>=3.48
      - pystac-client>=0.7
      - planetary-computer>=1.0
      - earthaccess>=0.9
      - evidently>=0.4
      - fastapi>=0.110
      - uvicorn[standard]>=0.27
      - prometheus-client>=0.20
